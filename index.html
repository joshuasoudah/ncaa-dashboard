<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Unofficial college football snapshot. Not affiliated with ESPN, the NCAA, or the schools.">
<meta name="theme-color" content="#013369">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FBS Board">
<title>FBS Board</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<script>
try {
  var stored = JSON.parse(localStorage.getItem("fbs-board-prefs-v1") || "{}");
  var theme = stored && stored.theme;
  var choice = theme === "light" || theme === "dark" ? theme : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = choice;
  var reduce = stored && stored.reduceMotion === true || matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (stored && stored.reduceMotion === false) reduce = false;
  document.documentElement.dataset.reduceMotion = reduce ? "true" : "false";
} catch (error) { /* keep the default theme */ }
</script>
</head>
<body>
<main>
  <div id="app">
    <div class="sticky">
      <header class="scoreboard">
        <div class="brand">
          <div>
            <h1>FBS Board</h1>
            <p id="season">Not connected</p>
            <p class="live-state" id="live-state"><span class="live-dot" aria-hidden="true"></span><span id="live-label">Snapshot</span></p>
          </div>
        </div>
      </header>
      <p class="meta" id="status" role="status">No snapshot is loaded.</p>
    </div>
  </div>
  <noscript><p>This board needs JavaScript. It does not include baked-in scores until a snapshot is loaded.</p></noscript>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
